name: Deploy to GitHub Pages

# Builds the site as static files and publishes them to GitHub Pages on every
# push to main. Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these; `contents: read` is enough for the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          BUILD_TARGET: static
          # Serving from https://<user>.github.io/<repo>/ instead of a custom
          # domain? Set BASE_PATH to "/<repo>" here.
          BASE_PATH: ""
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
